<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sinh Viên</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .text-danger {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Danh Sách Sinh Viên (SSR)</h1>

    <!-- Form tìm kiếm -->
    <form action="/students" method="GET">
        <input type="text" name="keyword" placeholder="Nhập tên..." />
        <button type="submit">Tìm</button>
    </form>

    <br>

    <!-- Nút thêm mới -->
    <a th:href="@{/students/new}" style="text-decoration: none;">
        <button type="button">Thêm Mới</button>
    </a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Họ và Tên</th>
                <th>Email</th>
                <th>Tuổi</th>
                <th>Chi tiết</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="student : ${dsSinhVien}" th:class="${student.age < 20} ? 'text-danger' : ''">

                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.age}"></td>

                <!-- Link xem chi tiết -->
                <td>
                    <a th:href="@{/students/{id}(id=${student.id})}">Xem chi tiết</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>

</html>
